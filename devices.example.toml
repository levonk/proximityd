# proximityd device identity mapping
# Place this file at:
#   - $PROXIMITYD_CONFIG_DIR/devices.toml  (if env var is set)
#   - $XDG_CONFIG_HOME/com.myorg.proximityd/devices.toml  (default on Linux/macOS)
#   - %APPDATA%\com\myorg\proximityd\config\devices.toml  (default on Windows)

# Maps Bluetooth MAC addresses to human-readable display names.
# The key under [devices] is the MAC address used for lookups.

[devices."AA:BB:CC:DD:EE:FF"]
mac = "AA:BB:CC:DD:EE:FF"
name = "Levon's Phone"

[devices."11:22:33:44:55:66"]
mac = "11:22:33:44:55:66"
name = "Levon's Watch"
